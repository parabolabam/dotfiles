# ============================================================================
#  Herdr Configuration
#  Replaces the old tmux setup. Run `herdr --default-config` to see all options.
# ============================================================================

# Skip the first-run notification setup prompt.
onboarding = false

# ============================================================================
#  Keys
# ============================================================================
[keys]
# Prefix key — carried over from tmux (`unbind C-b; set -g prefix C-s`).
# Caveat: herdr has no `send-prefix` equivalent, so pressing it twice does not
# emit a literal ctrl+s the way `bind C-s send-prefix` used to.
prefix = "ctrl+s"

# Everything else stays on herdr's defaults, which already match the old
# tmux binds closely:
#   prefix+h/j/k/l  focus pane left/down/up/right  (was bind h/j/k/l)
#   prefix+w        workspace picker               (was bind w, tv-tmux-windows)
#   prefix+g        goto / jump                    (was bind p, tv-tmux-panes)
#   prefix+v        split vertical
#   prefix+minus    split horizontal
#   prefix+shift+r  reload config                  (was bind r)
#   prefix+?        help

# Outer terminal is Ghostty without option-as-alt, so alt+ chords never reach
# herdr — everything below is prefix-based.
last_pane = "prefix+semicolon"        # tmux default last-pane
copy_mode = "prefix+["                # tmux copy-mode
previous_workspace = "prefix+comma"
next_workspace = "prefix+period"
next_agent = "prefix+a"               # walk the agent attention queue
previous_agent = "prefix+shift+a"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
clear_pane = "prefix+ctrl+l"

# Popups are session-modal and close when the command exits.
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+y"
type = "popup"
command = "yazi"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+t"
type = "popup"
command = "btop"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+d"
type = "popup"
command = "lazydocker"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+k"
type = "popup"
command = "k9s"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "zsh"             # scratch shell
width = "90%"
height = "90%"

# Dendy-style "select agent" screen: 8-bit card per agent, Enter jumps to it.
[[keys.command]]
key = "prefix+ctrl+a"
type = "popup"
command = "python3 \"$HOME/.config/herdr/agent-select/agent_select.py\""
width = "90%"
height = "90%"

# Open the live agent side pane (~36 cols) on the left of the current tab.
[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "sh \"$HOME/.config/herdr/agent-select/side-pane.sh\""

# ============================================================================
#  Theme
# ============================================================================
[theme]
# Kanagawa palette; no automatic light/dark switching.
name = "kanagawa"
auto_switch = false

# ============================================================================
#  Terminal
# ============================================================================
[terminal]
# herdr reads kitty_graphics from [terminal], not [experimental].
kitty_graphics = true

# ============================================================================
#  Session persistence (replaces tmux-resurrect)
# ============================================================================
# Herdr saves workspaces, tabs, pane layout, and per-pane cwd to
# ~/.config/herdr/session.json automatically on every change, and restores them
# on server start — no explicit save keystroke like resurrect's `prefix + a`.
# [session] resume_agents_on_restore is already true by default, which also
# resumes Claude/Codex conversations after a restart.

[experimental]
# Also restore pane scrollback across full server restarts. Experimental and
# off by default upstream; safe to remove if it misbehaves.
pane_history = true

# Forces the ASCII layout while the prefix is active, so prefix keys work on
# the Russian layout.
switch_ascii_input_source_in_prefix = true

# ============================================================================
#  UI
# ============================================================================
# Bare keys must stay above the [ui.*] sub-tables below, or TOML assigns them
# to whichever sub-table precedes them instead of to [ui].
[ui]
# prefix+b hides the built-in sidebar completely so the side pane replaces it.
sidebar_collapsed_mode = "hidden"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
pane_gaps = false                # tmux-style shared dividers
pane_outer_borders = false
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
tab_bar_right = [{ type = "zoom" }, { type = "datetime", format = "%a %d %b %H:%M" }]
window_title = "{workspace} · {tab}"

# Claude Code sets the terminal title to the current task, so show it as a
# second row.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_text", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# ============================================================================
#  Notifications (replaces Claude Code's Stop/Notification hooks)
# ============================================================================
# Those hooks shelled out to osascript for a macOS notification on every finish
# and permission prompt. herdr already tracks agent state via the claude
# integration hook, so it can report the same two events itself.
#
# Note: herdr only notifies for BACKGROUND workspaces — the pane you are
# looking at stays quiet, which the Stop hook did not respect.
# [ui.sound] is left at its defaults (enabled, herdr's own audio).
[ui.toast]
# In-app popup only; nothing reaches the macOS Notification Center.
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"
