id = "local.agent-emoji"
name = "Agent emoji"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Show agent states as emoji in the sidebar"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "emoji.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "emoji.py"]
